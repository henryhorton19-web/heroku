# The gate. CONTEXT.md 4.7: most code here is agent-written and will not be reviewed
# line by line, so quality rests on this being deterministic and un-bypassable.
# Never weaken a step to make something pass. If a rule genuinely cannot be satisfied,
# stop and escalate.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are SHA-pinned per GitHub's supply-chain hardening guidance, with the
      # human-readable version in a trailing comment. Dependabot keeps them current --
      # see .github/dependabot.yml. Do not hand-edit these to a moving major tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        # setup-uv stopped publishing moving tags at v8.0.0 (March 2026): @v8, @v9 and
        # @v10 do not resolve. Only full-version tags or SHAs work.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Sync (locked)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Guard (suppressions, authored Any, secret hygiene)
        run: uv run python scripts/guard.py

      - name: Tests
        run: uv run pytest

      - name: Migrations apply from empty
        # Catches a migration that only works against a database that already exists.
        run: |
          rm -f ci.db
          ARB_DB_PATH=ci.db uv run arb db upgrade
          ARB_DB_PATH=ci.db uv run arb doctor

      - name: Lockfile is current
        run: |
          uv lock --check
