# Free on public repos, which is why this repo is public. See CONTEXT.md section 5.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

# codeql-action is the exception to SHA pinning: GitHub explicitly recommends tracking
# it by major tag so server-side feature flags stay in sync. v3 is deprecated Dec 2026.
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
