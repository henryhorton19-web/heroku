# Alembic config. The URL is intentionally blank: env.py fills it from
# arb.config.Settings (ARB_DB_PATH), so there is one source of truth for where
# the database lives and no chance of a migration hitting a different file than
# the application does.
[alembic]
script_location = %(here)s/src/arb/migrations
prepend_sys_path = %(here)s/src
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
